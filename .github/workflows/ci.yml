name: CI — Lint & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.0.0 black==24.4.2 isort==5.13.2

      - name: flake8 (scripts only)
        run: |
          # Проверяем только скрипты — ноутбуки исключаем
          flake8 scripts/ tests/ --count --statistics

      - name: black (check)
        run: |
          black --check scripts/ tests/

      - name: isort (check)
        run: |
          isort --check-only scripts/ tests/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build (check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: |
          docker compose config

      - name: Docker Compose build (test)
        run: |
          # Проверяем, что образы собираются/подтягиваются
          docker compose pull || true
          docker compose build --parallel || true
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test