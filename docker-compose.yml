services:
  postgres:
    image: postgres:16-alpine
    container_name: abc_xyz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abc_xyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc_xyz_secret}
      POSTGRES_DB: ${POSTGRES_DB:-abc_xyz}
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abc_xyz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:3.1.0
    container_name: abc_xyz_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "abc_xyz_superset_secret_key_change_in_prod"
      SUPERSET_LOAD_EXAMPLES: "no"
      PYTHONPATH: "/app/pythonpath:/app/docker/pythonpath_dev"
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py:ro
      # ⚠️ Монтируем наш ZIP с дашбордами (read-only)
      - ./docker/dashboards.zip:/app/pythonpath/dashboards.zip:ro
    depends_on:
      postgres:
        condition: service_healthy
    # ⚠️ Команда в одну строку + импорт дашборда при старте
    command: /bin/sh -c "superset db upgrade && (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true) && superset init && /usr/bin/run-server.sh"

volumes:
  postgres_data:
    name: abc_xyz_postgres_data
  superset_home:
    name: abc_xyz_superset_home